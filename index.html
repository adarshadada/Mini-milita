<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mini Arena</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="menu">
  <h1>MINI ARENA</h1>
  <p>2D mobile shooter</p>
  <button id="play">PLAY</button>
  <button id="bots">BOTS: ON</button>
  <div class="help">Desktop: WASD / arrows, mouse to aim, click to fire.<br>Mobile: use the touch controls.</div>
</div>
<div id="hud" hidden>
  <div id="stats">HP 100 | AMMO 30 | KILLS 0</div>
  <div id="msg"></div>
</div>
<div id="touch" hidden>
  <div class="stick" id="move"><span></span></div>
  <div class="touchBtns">
    <button id="jump">JUMP</button>
    <button id="fire">FIRE</button>
    <button id="grenade">G</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
