<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sky Skirmish</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hud">
  <div><b>SKY SKIRMISH</b></div>
  <div>HP <span id="hp">100</span> | AMMO <span id="ammo">12</span> | SCORE <span id="score">0</span></div>
</div>
<canvas id="game"></canvas>
<div id="help">A/D move · W jump · Mouse aim · Click shoot · R reload · 1/2/3 weapons · P pause</div>
<div id="touch">
  <button data-key="a">◀</button><button data-key="d">▶</button>
  <button data-key="w">JUMP</button><button id="fire">FIRE</button>
</div>
<script src="game.js"></script>
</body>
</html>
